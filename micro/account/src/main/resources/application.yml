spring:
  application:
    name: account

  task:
    scheduling:
      pool:
        size: ${SCHED_POOL_SIZE:1}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:}

  # ---------------------------
  # Datasource (Postgres)
  # ---------------------------
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://base-datos:5432/account}
    username: ${SPRING_DATASOURCE_USERNAME:bank}
    password: ${SPRING_DATASOURCE_PASSWORD:bank}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  # ---------------------------
  # JPA (NO auto-migrations)
  # ---------------------------
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  # ---------------------------
  # Flyway (migraciones)
  # - En prod lo dejamos apagado por defecto
  # - En local/dev lo activas por profile
  # ---------------------------
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration}



# ---------------------------
# gRPC
# ---------------------------
grpc:
  server:
    port: ${GRPC_PORT:9092}
    reflection-service-enabled: ${GRPC_REFLECTION_ENABLED:false}


# ---------------------------
# App Props (tu record AppProps)
# ---------------------------
app:
  env: ${APP_ENV:local}

  aws:
    region: ${AWS_REGION:us-east-1}

    # AVP / Audit
    avpPolicyStoreId: ${AVP_POLICY_STORE_ID:ps-xxxxxxxxxxxxxxxx}
    auditBusName: ${AUDIT_BUS_NAME:imaginarybank-audit}

    # Cola donde llegan eventos "ledger.posted" (SQS)
    ledgerEventsQueueUrl: ${LEDGER_EVENTS_QUEUE_URL:http://localhost:4566/000000000000/ledger-events}

    # Endpoint opcional (LOCALSTACK) - lo usaremos en AwsClientsConfig
    endpoint: ${AWS_ENDPOINT_OVERRIDE:}

  security:
    issuer-uri: ${COGNITO_ISSUER_URI:}
    audience: ${COGNITO_AUDIENCE:}
    hashSalt: ${SECURITY_HASH_SALT:change-me}
    channel: ${SECURITY_CHANNEL:web}
    service-token:
      url: ${COGNITO_TOKEN_URL}
      client-id: ${COGNITO_CLIENT_ID}
      client-secret: ${COGNITO_CLIENT_SECRET}
      scope: ${COGNITO_SERVICE_SCOPE}

clients:
  ledger-target: "${LEDGER_GRPC_TARGET:ledger:9093}"
  identity-target: "${IDENTITY_GRPC_TARGET:identity:9090}"

messaging:
  sqs:
    enabled: ${SQS_ENABLED:true}

# ---------------------------
# Logging (útil para debug local)
# ---------------------------
logging:
  level:
    root: INFO
    com.tagokoder.account: INFO
    com.tagokoder.account.infra.security: DEBUG
    org.springframework.security: INFO
